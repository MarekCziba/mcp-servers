[project]
name = "datetime-utility-mcp"
version = "0.1.0"
description = "Work with timestamps, timezones and human-readable dates over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "llm", "ai"]
dependencies = [
    "mcp>=2.0,<3"
]

[project.scripts]
datetime-utility-mcp = "datetime_utility_mcp.main:main"

[project.urls]
Homepage = "https://github.com/MarekCziba/mcp-servers"
Repository = "https://github.com/MarekCziba/mcp-servers/tree/main/servers/datetime-utility-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datetime_utility_mcp"]
