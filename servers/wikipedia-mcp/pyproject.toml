[project]
name = "wikipedia-mcp"
version = "0.1.0"
description = "Search Wikipedia and fetch article summaries, text and links over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "llm", "ai", "wikipedia"]
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27.0"
]

[project.scripts]
wikipedia-mcp = "wikipedia_mcp.main:main"

[project.urls]
Homepage = "https://github.com/MarekCziba/mcp-servers"
Repository = "https://github.com/MarekCziba/mcp-servers/tree/main/servers/wikipedia-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wikipedia_mcp"]
