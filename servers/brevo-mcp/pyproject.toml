[project]
name = "brevo-mcp"
version = "0.1.0"
description = "Send transactional and bulk emails through the Brevo API over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "llm", "ai"]
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27.0"
]

[project.scripts]
brevo-mcp = "brevo_mcp.main:main"

[project.urls]
Homepage = "https://github.com/MarekCziba/mcp-servers"
Repository = "https://github.com/MarekCziba/mcp-servers/tree/main/servers/brevo-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brevo_mcp"]
