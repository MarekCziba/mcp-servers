[project]
name = "regex-tester-mcp"
version = "0.1.0"
description = "Test, replace and split text with regular expressions over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "llm", "ai"]
dependencies = [
    "mcp>=2.0,<3"
]

[project.scripts]
regex-tester-mcp = "regex_tester_mcp.main:main"

[project.urls]
Homepage = "https://github.com/MarekCziba/mcp-servers"
Repository = "https://github.com/MarekCziba/mcp-servers/tree/main/servers/regex-tester-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["regex_tester_mcp"]
