[project]
name = "github-mcp"
version = "0.1.0"
description = "Search GitHub and fetch repositories, issues, files and READMEs over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "llm", "ai", "github"]
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27.0"
]

[project.scripts]
github-mcp = "github_mcp.main:main"

[project.urls]
Homepage = "https://github.com/MarekCziba/mcp-servers"
Repository = "https://github.com/MarekCziba/mcp-servers/tree/main/servers/github-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["github_mcp"]
