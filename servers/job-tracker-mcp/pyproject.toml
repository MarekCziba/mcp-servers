[project]
name = "job-tracker-mcp"
version = "0.1.0"
description = "Local job application tracker over MCP: stages, history, interview stats, cold-application follow-ups, CSV export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "llm", "ai", "job-search", "sqlite"]
dependencies = [
    "mcp>=2.0,<3"
]

[project.scripts]
job-tracker-mcp = "job_tracker_mcp.main:main"

[project.urls]
Homepage = "https://github.com/MarekCziba/mcp-servers"
Repository = "https://github.com/MarekCziba/mcp-servers/tree/main/servers/job-tracker-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_tracker_mcp"]
