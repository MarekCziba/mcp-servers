[project]
name = "youtube-transcript-mcp"
version = "0.1.0"
description = "Fetch YouTube transcripts, video info and available languages over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "llm", "ai"]
dependencies = [
    "mcp>=2.0,<3",
    "youtube-transcript-api>=1.0.0",
    "httpx>=0.27.0"
]

[project.scripts]
youtube-transcript-mcp = "youtube_transcript_mcp.main:main"

[project.urls]
Homepage = "https://github.com/MarekCziba/mcp-servers"
Repository = "https://github.com/MarekCziba/mcp-servers/tree/main/servers/youtube-transcript-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["youtube_transcript_mcp"]
