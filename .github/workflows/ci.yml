name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install workspace dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check servers

      - name: Ruff format check
        run: uv run ruff format --check servers

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - base64-encoding-mcp
          - brevo-mcp
          - case-converter-mcp
          - color-converter-mcp
          - data-converter-mcp
          - datetime-utility-mcp
          - github-mcp
          - hash-checksum-mcp
          - job-tracker-mcp
          - password-generator-mcp
          - regex-tester-mcp
          - rss-feed-reader-mcp
          - seo-analyzer-mcp
          - text-diff-mcp
          - unit-converter-mcp
          - uuid-generator-mcp
          - website-to-markdown-mcp
          - wikipedia-mcp
          - youtube-transcript-mcp
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install workspace dependencies
        run: uv sync

      - name: Test ${{ matrix.server }}
        run: uv run pytest servers/${{ matrix.server }}

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - base64-encoding-mcp
          - brevo-mcp
          - case-converter-mcp
          - color-converter-mcp
          - data-converter-mcp
          - datetime-utility-mcp
          - github-mcp
          - hash-checksum-mcp
          - job-tracker-mcp
          - password-generator-mcp
          - regex-tester-mcp
          - rss-feed-reader-mcp
          - seo-analyzer-mcp
          - text-diff-mcp
          - unit-converter-mcp
          - uuid-generator-mcp
          - website-to-markdown-mcp
          - wikipedia-mcp
          - youtube-transcript-mcp
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build ${{ matrix.server }}
        run: uv build servers/${{ matrix.server }} --out-dir dist
